name: oauth implicit id_token
method: GET
url: $base_url/oauth/profile
timeout: 5000
auth:
  type: oauth2
  grant_type: implicit
  access_token_url: $base_url/oauth/token
  refresh_token_url: $base_url/oauth/token
  client_id: noodle-client
  client_secret: noodle-client-secret
  scope: openid profile
  credentials_id: noodle-local-implicit-id_token
  auto_fetch_token: true
  auto_refresh_token: true
  authorization_url: $base_url/oauth/authorize
  redirect_uri: http://127.0.0.1:8765/oauth/callback
  implicit_response_type: id_token
  token_source: id_token
assert:
  - expression: status
    operator: equals
    value: 200
