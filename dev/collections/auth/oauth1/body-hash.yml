name: body hash
method: POST
url: $base_url/auth/oauth1
timeout: 5000
auth:
  type: oauth1
  consumer_key: noodle-consumer
  consumer_secret: noodle-consumer-secret
  access_token: noodle-oauth-token
  access_token_secret: noodle-oauth-secret
  signature_method: HMAC-SHA256
  placement: header
  include_body_hash: true
body_type: json
body: '{"local":true}'
assert:
  - expression: status
    operator: equals
    value: 200
