name: discovery
method: GET
url: $base_url/oauth/profile
timeout: 5000
auth:
  type: oauth2
  grant_type: client_credentials
  access_token_url: ""
  refresh_token_url: ""
  client_id: noodle-client
  client_secret: noodle-client-secret
  scope: openid profile
  credentials_id: noodle-local-discovery
  auto_fetch_token: true
  auto_refresh_token: true
  discovery_url: $base_url
assert:
  - expression: status
    operator: equals
    value: 200
