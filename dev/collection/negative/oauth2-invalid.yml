name: oauth2 invalid
method: GET
url: $base_url/oauth/profile
timeout: 5000
auth:
  type: oauth2
  grant_type: client_credentials
  access_token_url: $base_url/oauth/token
  refresh_token_url: $base_url/oauth/token
  client_id: $oauth_client_id
  client_secret: $invalid_credential
  scope: openid profile
  credentials_id: noodle-local-invalid
  auto_fetch_token: true
  auto_refresh_token: true
