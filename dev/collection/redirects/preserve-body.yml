name: preserve body
method: POST
url: $base_url/redirect/preserve
timeout: 5000
auth:
  type: none
body_type: json
body: '{"message":"$message"}'
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.method
    operator: equals
    value: POST
  - expression: body.json.message
    operator: equals
    value: $message
