name: preserve body
method: POST
url: $base_url/redirect/preserve
timeout: 5000
followRedirects: true
maxRedirects: 5
body: |-
  {
    "message": "$message"
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.method
    operator: equals
    value: POST
  - expression: body.json.message
    operator: equals
    value: $message
