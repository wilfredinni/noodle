name: persistent script
method: GET
url: $base_url/echo
timeout: 5000
auth:
  type: none
scripts:
  pre: 'noodle.run.set("saved_script", "local", { persist: "environment" })'
  post: 'noodle.run.set("saved_secret", "development-only", { persist: "secret" })'
assert:
  - expression: status
    operator: equals
    value: 200
