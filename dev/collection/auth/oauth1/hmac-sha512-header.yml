name: hmac sha512 header
method: GET
url: $base_url/auth/oauth1
timeout: 5000
auth:
  type: oauth1
  consumer_key: noodle-consumer
  consumer_secret: noodle-consumer-secret
  access_token: noodle-oauth-token
  access_token_secret: noodle-oauth-secret
  signature_method: HMAC-SHA512
  placement: header
  private_key: ./fixtures/rsa.pem
  private_key_type: file
assert:
  - expression: status
    operator: equals
    value: 200
