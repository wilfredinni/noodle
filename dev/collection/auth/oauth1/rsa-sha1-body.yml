name: rsa sha1 body
method: POST
url: $base_url/auth/oauth1
timeout: 5000
auth:
  type: oauth1
  consumer_key: $oauth_consumer_key
  consumer_secret: $oauth_consumer_secret
  access_token: $oauth_token
  access_token_secret: $oauth_token_secret
  signature_method: RSA-SHA1
  placement: body
  private_key: ./fixtures/rsa.pem
  private_key_type: file
body_type: urlencoded
form_data:
  - name: message
    value: local
    enabled: true
    type: text
assert:
  - expression: status
    operator: equals
    value: 200
