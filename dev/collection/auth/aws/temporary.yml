name: temporary
method: GET
url: $base_url/auth/aws
timeout: 5000
auth:
  type: aws_sigv4
  access_key: NOODLEDEVACCESS
  secret_key: noodle-development-secret
  region: us-east-1
  service: execute-api
  session_token: noodle-development-session
assert:
  - expression: status
    operator: equals
    value: 200
