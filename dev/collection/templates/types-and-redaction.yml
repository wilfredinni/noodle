name: types and redaction
method: POST
url: $base_url/echo
timeout: 5000
followRedirects: true
maxRedirects: 5
body: |-
  {
    "id": "$random.uuid",
    "password": "$random.password",
    "number": $random.number({"min":1,"max":10}),
    "boolean": $random.boolean,
    "time": $time.now,
    "iso": $time.iso
  }
body_type: json
scripts:
  pre: |2-
    const body = noodle.request.body.json(); if (typeof body.number !== "number" || typeof body.boolean !== "boolean" || body.id.startsWith("$")) throw Error("templates not prepared"); console.log(body.password)
assert:
  - expression: status
    operator: equals
    value: 200
tests: |2-
  test("JSON template types", () => { const body = noodle.response.json().json; expect(body.number).toBeTypeOf("number"); expect(body.boolean).toBeTypeOf("boolean"); expect(body.time).toBeTypeOf("number") })
