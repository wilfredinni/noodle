      "loremLines": $random.loremLines,
      "companyName": $random.companyName,
      "companySuffix": $random.companySuffix,
      "businessPhrase": $random.businessPhrase,
      "businessAdjective": $random.businessAdjective,
      "businessBuzzword": $random.businessBuzzword,
      "businessNoun": $random.businessNoun,
      "catchPhrase": $random.catchPhrase,
      "catchPhraseAdjective": $random.catchPhraseAdjective,
      "catchPhraseDescriptor": $random.catchPhraseDescriptor,
      "catchPhraseNoun": $random.catchPhraseNoun,
      "jobTitle": $random.jobTitle,
      "jobArea": $random.jobArea,
      "jobDescriptor": $random.jobDescriptor,
      "jobType": $random.jobType,
      "product": $random.product,
      "productName": $random.productName,
      "productAdjective": $random.productAdjective,
      "productMaterial": $random.productMaterial,
      "department": $random.department,
      "price": $random.price,
      "bankAccount": $random.bankAccount,
      "bankAccountName": $random.bankAccountName,
      "creditCardMask": $random.creditCardMask,
      "bic": $random.bic,
      "iban": $random.iban,
      "transactionType": $random.transactionType,
      "currencyCode": $random.currencyCode,
      "currencyName": $random.currencyName,
      "currencySymbol": $random.currencySymbol,
      "bitcoinAddress": $random.bitcoinAddress,
      "databaseColumn": $random.databaseColumn,
      "databaseType": $random.databaseType,
      "databaseCollation": $random.databaseCollation,
      "databaseEngine": $random.databaseEngine,
      "fileName": $random.fileName,
      "fileExtension": $random.fileExtension,
      "fileType": $random.fileType,
      "commonFileName": $random.commonFileName,
      "commonFileExtension": $random.commonFileExtension,
      "commonFileType": $random.commonFileType,
      "filePath": $random.filePath,
      "directoryPath": $random.directoryPath,
      "mimeType": $random.mimeType,
      "avatarUrl": $random.avatarUrl,
      "imageUrl": $random.imageUrl,
      "imageDataUri": $random.imageDataUri,
        "pick": $random.pick(["local"])
  }
tests: >-
  test("random catalog expanded", () => { const
  body=noodle.response.json().json;
  expect(body.uuid).toMatch(/^[0-9a-f-]{36}$/);
  expect(body.number).toBeTypeOf("number");
  expect(body.boolean).toBeTypeOf("boolean") })
