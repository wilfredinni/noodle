name: random-catalog
method: POST
url: $base_url/echo
timeout: 5000
auth:
  type: none
assert:
  - expression: status
    operator: equals
    value: 200
body_type: json
body: |-
  {
      "uuid": $random.uuid,
      "id": $random.id,
      "nanoId": $random.nanoId,
      "number": $random.number,
      "float": $random.float,
      "boolean": $random.boolean,
      "alphaNumeric": $random.alphaNumeric,
      "abbreviation": $random.abbreviation,
      "name": $random.name,
      "firstName": $random.firstName,
      "lastName": $random.lastName,
      "namePrefix": $random.namePrefix,
      "nameSuffix": $random.nameSuffix,
      "email": $random.email,
      "exampleEmail": $random.exampleEmail,
      "username": $random.username,
      "phone": $random.phone,
      "phoneWithExtension": $random.phoneWithExtension,
      "address": $random.address,
      "streetName": $random.streetName,
      "city": $random.city,
      "country": $random.country,
      "countryCode": $random.countryCode,
      "latitude": $random.latitude,
      "longitude": $random.longitude,
      "ipv4": $random.ipv4,
      "ipv6": $random.ipv6,
      "macAddress": $random.macAddress,
      "url": $random.url,
      "domainName": $random.domainName,
      "domainSuffix": $random.domainSuffix,
      "domainWord": $random.domainWord,
      "userAgent": $random.userAgent,
      "protocol": $random.protocol,
      "locale": $random.locale,
      "semver": $random.semver,
      "datePast": $random.datePast({"refDate":"2026-01-01T00:00:00Z"}),
      "dateFuture": $random.dateFuture({"refDate":"2026-01-01T00:00:00Z"}),
      "dateRecent": $random.dateRecent,
      "weekday": $random.weekday,
      "month": $random.month,
      "timestamp": $random.timestamp,
      "isoTimestamp": $random.isoTimestamp,
      "color": $random.color,
      "hexColor": $random.hexColor,
      "word": $random.word,
      "words": $random.words,
      "noun": $random.noun,
      "verb": $random.verb,
      "ingVerb": $random.ingVerb,
      "adjective": $random.adjective,
      "phrase": $random.phrase,
      "loremWord": $random.loremWord,
      "loremWords": $random.loremWords,
      "loremSentence": $random.loremSentence,
      "loremSentences": $random.loremSentences,
      "loremParagraph": $random.loremParagraph,
