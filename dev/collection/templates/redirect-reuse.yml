name: redirect reuse
method: POST
url: $base_url/redirect/preserve
timeout: 5000
followRedirects: true
maxRedirects: 5
body: |-
  {
    "id": "$random.uuid",
    "time": $time.iso
  }
body_type: json
scripts:
  pre: |2-
    noodle.run.set("templateId", noodle.request.body.json().id)
assert:
  - expression: status
    operator: equals
    value: 200
tests: |2-
  test("redirect preserves prepared template", () => expect(noodle.response.json().json.id).toBe(noodle.run.get("templateId")))
