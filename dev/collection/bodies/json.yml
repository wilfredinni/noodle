name: json
method: POST
url: $base_url/echo
timeout: 5000
followRedirects: true
maxRedirects: 5
body: |-
  {
    "message": "$message",
    "number": 42
  }
body_type: json
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.json.number
    operator: equals
    value: 42
