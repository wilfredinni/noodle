name: 03-post-fail
method: GET
url: $base_url/echo
timeout: 5000
auth:
  type: none
assert:
  - expression: status
    operator: equals
    value: 200
scripts:
  post: >-
    noodle.run.set("transactionValue", "changed");
    noodle.cookies.set({name:"rollback",value:"changed"}); throw
    Error("intentional post rollback")
