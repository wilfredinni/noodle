name: chained captures
method: GET
url: $base_url/echo
timeout: 5000
auth:
  type: none
scripts:
  pre: >-
    await noodle.runRequest("scripts/pre-post");
    noodle.request.headers.set("X-Captured", noodle.run.get("prepared_header"))
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.headers.x-captured
    operator: equals
    value: prepared
