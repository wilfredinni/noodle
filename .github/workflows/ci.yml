name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate when called from another workflow
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  response-files:
    name: response files (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/build-response-file-native.ts --check
      - run: bun install --frozen-lockfile
      - run: bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts --timeout=30000
      - name: Test shipped addon inside standalone executable
        run: |
          set -euo pipefail
          bun build --compile src/app/cli.ts --outfile noodle-response-smoke
          bun scripts/sign-macos-binary.ts ./noodle-response-smoke
          bun scripts/compiled-script-smoke.ts ./noodle-response-smoke
          expected="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          actual="$(./noodle-response-smoke --version)"
          test "$actual" = "$expected" || {
            echo "Compiled binary reported $actual, expected $expected" >&2
            exit 1
          }
          NOODLE_TEST_BINARY="$PWD/noodle-response-smoke" bun test tests/integration/binaryResponse.test.ts --timeout=30000
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Independently rebuild and test native source
        run: |
          bun scripts/build-response-file-native.ts --target=${{ matrix.target }}
          bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts --timeout=30000
      - name: Package test build
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir test-build
          cp noodle-response-smoke test-build/noodle
          chmod 755 test-build/noodle
          (cd test-build && shasum -a 256 noodle > SHA256SUMS)
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "target=$TARGET"
            echo "version=$(./noodle-response-smoke --version)"
            echo "bun=$(bun --version)"
          } > test-build/BUILD_INFO.txt
          tar -czf "noodle-test-$TARGET.tar.gz" -C test-build noodle SHA256SUMS BUILD_INFO.txt
      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        id: test-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: noodle-test-${{ matrix.target }}.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Link test build
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          echo "[Download test build for $TARGET]($ARTIFACT_URL) (expires in 7 days)" >> "$GITHUB_STEP_SUMMARY"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check ./src ./tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun test
