name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate when called from another workflow
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform:
    name: platform (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            binary: noodle-ci
          - os: macos-15-intel
            target: darwin-x64
            binary: noodle-ci
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: noodle-ci
          - os: ubuntu-latest
            target: linux-x64
            binary: noodle-ci
          - os: windows-11-arm
            target: win32-arm64
            binary: noodle-ci.exe
          - os: windows-latest
            target: win32-x64
            binary: noodle-ci.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ matrix.target }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-bun-
      - run: bun scripts/build-response-file-native.ts --check
      - run: bun install --frozen-lockfile
      - name: Run full test suite
        run: bun test
      - name: Test shipped addon inside standalone executable
        run: |
          set -euo pipefail
          bun build --compile src/app/cli.ts --outfile "${{ matrix.binary }}"
          bun scripts/sign-macos-binary.ts "./${{ matrix.binary }}"
          bun scripts/compiled-script-smoke.ts "./${{ matrix.binary }}"
          expected="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          actual="$("./${{ matrix.binary }}" --version)"
          test "$actual" = "$expected" || {
            echo "Compiled binary reported $actual, expected $expected" >&2
            exit 1
          }
          bun -e '
            import { resolve } from "node:path";
            const binary = resolve("${{ matrix.binary }}");
            const child = Bun.spawn([process.execPath, "test", "tests/integration/binaryResponse.test.ts", "--timeout=30000"], {
              env: { ...process.env, NOODLE_TEST_BINARY: binary }, stdout: "inherit", stderr: "inherit",
            });
            process.exit(await child.exited);
          '
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Independently rebuild and test native source
        run: |
          bun scripts/build-response-file-native.ts --target=${{ matrix.target }}
          bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts --timeout=30000

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check ./src ./tests
