name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to validate when called from another workflow
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  platform-checks:
    name: platform checks (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
            asset: noodle-macos-arm64
            shell: bash
          - os: macos-15-intel
            target: darwin-x64
            asset: noodle-macos-x86_64
            shell: bash
          - os: ubuntu-24.04-arm
            target: linux-arm64
            asset: noodle-linux-arm64
            shell: bash
          - os: ubuntu-latest
            target: linux-x64
            asset: noodle-linux-x86_64
            shell: bash
          - os: windows-latest
            target: win32-x64
            asset: noodle-windows-x86_64.exe
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 10 }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      ASSET_NAME: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Verify shipped native source and prebuild hashes
        run: bun scripts/build-response-file-native.ts --check
      - run: bun install --frozen-lockfile
      - name: Check generated script API
        run: bun run script:check
      - name: Check generated schema validator
        run: bun scripts/build-schema-validator.ts --check
      - name: Check bundled script type libraries
        run: bun scripts/build-script-type-libraries.ts --check
      - name: Test shipped addon and diagnostics
        run: bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts tests/integration/scriptDiagnosticsBundle.test.ts --timeout=30000
      - name: Test native Windows Credential Manager
        if: runner.os == 'Windows'
        env:
          NOODLE_TEST_WINDOWS_NATIVE: "1"
        run: bun test tests/integration/windowsCredentials.test.ts --timeout=30000
      - name: Compile standalone with shipped addon and worker assets
        run: bun build --compile --entry-naming '[name].[ext]' src/app/cli.ts src/ui/editor/scriptDiagnostics.worker.ts --outfile "${{ matrix.asset }}"
      - name: Sign and verify macOS binary
        if: runner.os == 'macOS'
        run: bun scripts/sign-macos-binary.ts "./${{ matrix.asset }}"
      - name: Test Unix standalone executable
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bun scripts/compiled-script-smoke.ts "./$ASSET_NAME"
          expected="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          actual=$("./$ASSET_NAME" --version)
          test "$actual" = "$expected" || {
            echo "Compiled binary reported $actual, expected $expected" >&2
            exit 1
          }
          NOODLE_TEST_BINARY="$PWD/$ASSET_NAME" bun test tests/integration/binaryResponse.test.ts --timeout=30000
      - name: Test Windows standalone executable
        if: runner.os == 'Windows'
        run: |
          $expected = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actual = & ".\$env:ASSET_NAME" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -ne $expected) { throw "Compiled binary reported $actual, expected $expected" }
          bun scripts/compiled-script-smoke.ts "./$env:ASSET_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NOODLE_TEST_BINARY = Join-Path $PWD $env:ASSET_NAME
          bun test tests/integration/binaryResponse.test.ts tests/integration/postResponseCli.test.ts tests/integration/inlineTestsCli.test.ts --timeout=30000
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Independently rebuild native source
        run: bun scripts/build-response-file-native.ts --target=${{ matrix.target }}
      - name: Test independently rebuilt native downloads
        run: bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts --timeout=30000
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: runner.os != 'Windows'
        with:
          version: 0.16.0
      - name: Build Homebrew executable from archived source
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/noodle-homebrew"
          mkdir -p "$source_dir/noodle"
          curl --fail --location --silent --show-error https://github.com/anomalyco/opentui/archive/refs/tags/v0.5.14.tar.gz -o "$source_dir/opentui.tar.gz"
          printf '%s  %s\n' 0e092b7405934c3a30f6eca2cb6e35eb00d9d8948d15daa69af2371e1e641a6e "$source_dir/opentui.tar.gz" | shasum -a 256 -c -
          tar -xzf "$source_dir/opentui.tar.gz" -C "$source_dir"
          git archive HEAD | tar -x -C "$source_dir/noodle"
          cd "$source_dir/noodle"
          bun run build:homebrew --opentui-source "$source_dir/opentui-0.5.14" --zig "$(command -v zig)" --outfile "$source_dir/noodle-source"
          NOODLE_TEST_BINARY="$source_dir/noodle-source" bun test tests/unit/responseFile.test.ts tests/integration/binaryResponse.test.ts tests/integration/scriptDiagnosticsBundle.test.ts --timeout=30000
      - name: Record validated binary metadata
        run: bun scripts/release-artifacts.ts record "${{ matrix.target }}"
      - name: Upload validated binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-${{ matrix.asset }}
          path: validated-build/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Package Unix test build
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir test-build
          cp "$ASSET_NAME" test-build/noodle
          chmod 755 test-build/noodle
          (cd test-build && shasum -a 256 noodle > SHA256SUMS)
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "target=$TARGET"
            echo "version=$("./$ASSET_NAME" --version)"
            echo "bun=$(bun --version)"
          } > test-build/BUILD_INFO.txt
          tar -czf "noodle-test-$TARGET.tar.gz" -C test-build noodle SHA256SUMS BUILD_INFO.txt
      - name: Package Windows beta test build
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path test-build | Out-Null
          Copy-Item $env:ASSET_NAME test-build/noodle.exe
          $checksum = (Get-FileHash test-build/noodle.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  noodle.exe" | Set-Content test-build/SHA256SUMS -Encoding utf8NoBOM
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = & ".\$env:ASSET_NAME" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bunVersion = bun --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("commit=$commit", "target=windows-x64", "version=$version", "bun=$bunVersion", "native=shipped-prebuild", "support=beta") | Set-Content test-build/BUILD_INFO.txt -Encoding utf8NoBOM
          Compress-Archive -Path test-build/* -DestinationPath noodle-test-windows-x64-beta.zip
      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        id: test-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: ${{ runner.os == 'Windows' && 'noodle-test-windows-x64-beta.zip' || format('noodle-test-{0}.tar.gz', matrix.target) }}
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Link test build
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT_URL: ${{ steps.test-build.outputs.artifact-url }}
        run: |
          bun -e 'import { appendFileSync } from "node:fs"; appendFileSync(process.env.GITHUB_STEP_SUMMARY!, "[Download test build for " + process.env.TARGET + "](" + process.env.ARTIFACT_URL + ") (expires in 7 days)\n")'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check ./src ./tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun test

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - name: Run complete applicable Windows suite
        run: bun test --timeout=30000
