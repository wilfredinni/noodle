name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - run: |
          gh release view "$TAG" &>/dev/null && echo "Release already exists, skipping creation." || gh release create "$TAG" --title "$TAG" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/app/cli.ts --outfile noodle-${{ matrix.target }}
      - run: gh release upload "$TAG" noodle-${{ matrix.target }} --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}

  notify-homebrew:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.HOMEBREW_TAP_TOKEN }}" \
            "https://api.github.com/repos/wilfredinni/homebrew-noodle/dispatches" \
            -d '{"event_type": "new-release", "client_payload": {"version": "${{ needs.create-release.outputs.tag }}"}}'
