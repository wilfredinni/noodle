name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    needs: validate-release
    if: needs.validate-release.outputs.ci-run-id == ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate-release.outputs.commit }}

  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      ci-run-id: ${{ steps.ci.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Validate tag and package version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          if [[ "v$package_version" != "$tag" ]]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag must point to a commit already integrated into main" >&2
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Find successful CI and tested binaries
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.tag.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$COMMIT_SHA&branch=main&event=push&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No main CI run for $COMMIT_SHA; release will run CI."
            exit 0
          fi
          while :; do
            run=$(gh api "repos/$GH_REPO/actions/runs/$run_id")
            jq -e --arg sha "$COMMIT_SHA" --arg repo "$GH_REPO" '
              .head_sha == $sha and .head_branch == "main" and .event == "push"
              and .repository.full_name == $repo and .head_repository.full_name == $repo
              and .path == ".github/workflows/ci.yml"
            ' <<< "$run" > /dev/null
            if [ "$(jq -r '.status' <<< "$run")" = completed ]; then
              break
            fi
            echo "Waiting for CI run $run_id on $COMMIT_SHA..."
            sleep 15
          done
          if [ "$(jq -r '.conclusion' <<< "$run")" != success ]; then
            echo "CI run $run_id did not succeed; refusing to release." >&2
            exit 1
          fi
          artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
          for target in macos-arm64 macos-x86_64 linux-x86_64 linux-arm64; do
            if ! grep -Fxq "release-$target" <<< "$artifacts"; then
              echo "CI binaries are missing or expired; release will run CI."
              exit 0
            fi
          done
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Reusing CI run $run_id and its tested binaries."

  create-release:
    needs: [quality, validate-release]
    if: >-
      !cancelled() && needs.validate-release.result == 'success' &&
      (needs.quality.result == 'success' || needs.validate-release.outputs.ci-run-id != '')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          existing_draft=""
          if existing_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            test "$existing_draft" = "true" || {
              echo "Refusing to replace assets of published release $TAG" >&2
              exit 1
            }
          fi
          bun scripts/release-notes.ts --tag "$TAG" > release-notes.md
          if [ "$existing_draft" = "true" ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi

  checksums:
    needs: [create-release, validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-release.outputs.ci-run-id || github.run_id }}
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(find release-assets -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 4
          for binary in noodle-macos-arm64 noodle-macos-x86_64 noodle-linux-x86_64 noodle-linux-arm64; do
            test -f "release-assets/$binary"
            test -s "release-assets/$binary"
            test ! -L "release-assets/$binary"
          done
          (cd release-assets && sha256sum noodle-* | LC_ALL=C sort -k2,2) > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(wc -l < release-assets/SHA256SUMS | tr -d ' ')" = 4
          for binary in noodle-macos-arm64 noodle-macos-x86_64 noodle-linux-x86_64 noodle-linux-arm64; do
            grep -Eq "^[[:xdigit:]]{64}[[:space:]]{2}${binary}$" release-assets/SHA256SUMS
          done
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" || {
            echo "Refusing to replace assets of published release $TAG" >&2
            exit 1
          }
          gh release upload "$TAG" release-assets/noodle-* release-assets/SHA256SUMS --clobber

  validate-macos-artifact:
    needs: [create-release, checksums]
    permissions:
      contents: write # Draft release downloads require push access.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      ASSET_NAME: noodle-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Download draft macOS release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release download "$TAG" --pattern "$ASSET_NAME" --pattern 'SHA256SUMS' --dir release-assets
      - name: Verify downloaded macOS binary
        shell: bash
        run: |
          set -euo pipefail
          binary="release-assets/$ASSET_NAME"
          expected_hash=$(awk -v name="$ASSET_NAME" '$2 == name { print $1 }' release-assets/SHA256SUMS)
          [[ "$expected_hash" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "Missing or invalid macOS release checksum" >&2
            exit 1
          }
          actual_hash=$(shasum -a 256 "$binary" | awk '{ print $1 }')
          test "$actual_hash" = "$expected_hash" || {
            echo "Downloaded macOS release checksum mismatch" >&2
            exit 1
          }
          /usr/bin/codesign --verify --strict --verbose=2 "$binary"
          chmod 755 "$binary"
          expected_version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          actual_version=$("./$binary" --version)
          test "$actual_version" = "$expected_version" || {
            echo "Downloaded binary reported $actual_version, expected $expected_version" >&2
            exit 1
          }
          bun scripts/compiled-script-smoke.ts "./$binary"

  notify-homebrew:
    needs: [create-release, checksums, undraft]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/wilfredinni/homebrew-noodle/dispatches" \
            -d "{\"event_type\": \"new-release\", \"client_payload\": {\"version\": \"$VERSION\"}}"

  undraft:
    needs: [create-release, checksums, validate-macos-artifact]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  publish-update-manifest:
    needs: [create-release, checksums, undraft]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Download release SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'SHA256SUMS' --dir .

      - name: Build update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail

          macos_hash=$(awk '$2 == "noodle-macos-arm64" { print $1 }' SHA256SUMS)
          macos_x86_hash=$(awk '$2 == "noodle-macos-x86_64" { print $1 }' SHA256SUMS)
          linux_x86_hash=$(awk '$2 == "noodle-linux-x86_64" { print $1 }' SHA256SUMS)
          linux_arm_hash=$(awk '$2 == "noodle-linux-arm64" { print $1 }' SHA256SUMS)

          test -n "$macos_hash" || { echo "Missing macos-arm64 checksum" >&2; exit 1; }
          test -n "$macos_x86_hash" || { echo "Missing macos-x86_64 checksum" >&2; exit 1; }
          test -n "$linux_x86_hash" || { echo "Missing linux-x86_64 checksum" >&2; exit 1; }
          test -n "$linux_arm_hash" || { echo "Missing linux-arm64 checksum" >&2; exit 1; }

          echo "{" > update.json
          echo "  \"version\": \"${TAG}\"," >> update.json
          echo "  \"assets\": {" >> update.json
          echo "    \"macos-arm64\": { \"sha256\": \"${macos_hash}\" }," >> update.json
          echo "    \"macos-x86_64\": { \"sha256\": \"${macos_x86_hash}\" }," >> update.json
          echo "    \"linux-x86_64\": { \"sha256\": \"${linux_x86_hash}\" }," >> update.json
          echo "    \"linux-arm64\": { \"sha256\": \"${linux_arm_hash}\" }" >> update.json
          echo "  }" >> update.json
          echo "}" >> update.json

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wilfredinni/noodle-site
          token: ${{ secrets.NOODLE_SITE_TOKEN }}
          path: noodle-site

      - name: Publish update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        working-directory: noodle-site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp ../update.json public/update.json

          if git diff --quiet; then
            echo "No changes to update.json"
            exit 0
          fi

          git add public/update.json
          git commit -m "Update manifests for Noodle ${TAG}"
          git push origin main
