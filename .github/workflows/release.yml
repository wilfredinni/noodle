name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  validate-release:
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - &require-release-admins
        name: Require repository admins for publishing and reruns
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for actor in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$actor/permission" --jq .permission)"
            if [ "$permission" != "admin" ]; then
              echo "$actor must have repository admin permission to publish" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          if [[ "v$package_version" != "$tag" ]]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag must point to a commit already integrated into main" >&2
            exit 1
          fi

  create-release:
    needs: [quality, validate-release]
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - *require-release-admins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          existing_draft=""
          if existing_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            test "$existing_draft" = "true" || {
              echo "Refusing to replace assets of published release $TAG" >&2
              exit 1
            }
          fi
          bun scripts/release-notes.ts --tag "$TAG" > release-notes.md
          if [ "$existing_draft" = "true" ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi

  build:
    needs: create-release
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: noodle-macos-arm64
          - os: macos-15-intel
            asset: noodle-macos-x86_64
          - os: ubuntu-latest
            asset: noodle-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: noodle-linux-arm64
          - os: windows-11-arm
            asset: noodle-windows-arm64.exe
          - os: windows-latest
            asset: noodle-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - *require-release-admins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/app/cli.ts --outfile "${{ matrix.asset }}"
      - name: Sign and verify macOS binary
        run: bun scripts/sign-macos-binary.ts "./${{ matrix.asset }}"
      - name: Smoke test compiled binary
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/compiled-script-smoke.ts "./${{ matrix.asset }}"
          expected="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          actual="$("./${{ matrix.asset }}" --version)"
          test "$actual" = "$expected" || {
            echo "Compiled binary reported $actual, expected $expected" >&2
            exit 1
          }
      - name: Upload binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" || {
            echo "Refusing to replace assets of published release $TAG" >&2
            exit 1
          }
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber

  checksums:
    needs: [create-release, build]
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - *require-release-admins
      - name: Download release binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --pattern 'noodle-*' --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f -name 'noodle-*' | wc -l | tr -d ' ')" = 6
      - name: Generate checksums and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum noodle-* | LC_ALL=C sort -k2,2) > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(wc -l < release-assets/SHA256SUMS | tr -d ' ')" = 6
          for binary in noodle-linux-arm64 noodle-linux-x86_64 noodle-macos-arm64 noodle-macos-x86_64 noodle-windows-arm64.exe noodle-windows-x86_64.exe; do
            grep -Eq "^[[:xdigit:]]{64}[[:space:]]{2}${binary}$" release-assets/SHA256SUMS
          done
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" || {
            echo "Refusing to replace checksums of published release $TAG" >&2
            exit 1
          }
          gh release upload "$TAG" release-assets/SHA256SUMS --clobber

  validate-artifact:
    needs: [create-release, checksums]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: noodle-macos-arm64
          - os: macos-15-intel
            asset: noodle-macos-x86_64
          - os: ubuntu-24.04-arm
            asset: noodle-linux-arm64
          - os: ubuntu-latest
            asset: noodle-linux-x86_64
          - os: windows-11-arm
            asset: noodle-windows-arm64.exe
          - os: windows-latest
            asset: noodle-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Download draft release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release download "$TAG" --pattern '${{ matrix.asset }}' --pattern 'SHA256SUMS' --dir release-assets
      - name: Verify downloaded release binary
        run: bun scripts/validate-release-artifact.ts "release-assets/${{ matrix.asset }}"

  notify-homebrew:
    needs: [create-release, checksums, undraft]
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - *require-release-admins
      - name: Notify Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/wilfredinni/homebrew-noodle/dispatches" \
            -d "{\"event_type\": \"new-release\", \"client_payload\": {\"version\": \"$VERSION\"}}"

  undraft:
    needs: [create-release, checksums, validate-artifact]
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - *require-release-admins
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" ]; then
            gh release edit "$TAG" --draft=false
          else
            echo "Release $TAG is already published"
          fi

  publish-update-manifest:
    needs: [create-release, checksums, undraft]
    if: github.repository == 'wilfredinni/noodle' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: noodle-site-update
      cancel-in-progress: false
    steps:
      - *require-release-admins
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Download release SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'SHA256SUMS' --dir .

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wilfredinni/noodle-site
          token: ${{ secrets.NOODLE_SITE_TOKEN }}
          ref: main
          fetch-depth: 0
          path: noodle-site

      - name: Publish update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          git -C noodle-site config user.name "github-actions[bot]"
          git -C noodle-site config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git -C noodle-site fetch origin main
            git -C noodle-site reset --hard origin/main
            bun scripts/build-update-manifest.ts \
              --tag "$TAG" \
              --checksums SHA256SUMS \
              --manifest noodle-site/public/update.json

            if git -C noodle-site diff --quiet -- public/update.json; then
              exit 0
            fi

            git -C noodle-site add public/update.json
            git -C noodle-site commit -m "Update manifests for Noodle ${TAG}"
            if git -C noodle-site push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to publish update.json after 3 attempts" >&2
          exit 1
