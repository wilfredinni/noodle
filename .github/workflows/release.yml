name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to recover (site manifest and Homebrew only)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      tag: ${{ steps.ref.outputs.tag }}
    steps:
      - name: Resolve release commit
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object')
          for depth in 1 2 3 4 5; do
            type=$(jq -r .type <<< "$object")
            sha=$(jq -r .sha <<< "$object")
            if [ "$type" = commit ]; then break; fi
            test "$type" = tag
            object=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object')
          done
          test "$type" = commit
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          if [ "$EVENT" = push ]; then test "$sha" = "$EVENT_SHA"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Validate tag and package version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ref.outputs.tag }}
          RELEASE_SHA: ${{ steps.ref.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          package_version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          test "v$package_version" = "$TAG" || { echo "Tag does not match package.json version" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "Release commit must be integrated into main" >&2; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            gh release view "$TAG" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false).tagName' | grep -Fx "$TAG"
          fi

  resolve-ci:
    needs: validate-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.ci.outputs.reuse }}
      run-id: ${{ steps.ci.outputs.run-id }}
      artifact-ids: ${{ steps.ci.outputs.artifact-ids }}
      reason: ${{ steps.ci.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Select successful CI for the exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: bun scripts/release-artifacts.ts resolve

  quality:
    needs: [validate-release, resolve-ci]
    if: needs.resolve-ci.outputs.reuse == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate-release.outputs.sha }}

  create-release:
    needs: [validate-release, resolve-ci, quality]
    if: ${{ always() && !cancelled() && needs.validate-release.result == 'success' && needs.resolve-ci.result == 'success' && (needs.resolve-ci.outputs.reuse == 'true' || needs.quality.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: tag
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          existing_draft=""
          if existing_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            test "$existing_draft" = "true" || {
              echo "Refusing to replace assets of published release $TAG" >&2
              exit 1
            }
          fi
          bun scripts/release-notes.ts --tag "$TAG" > release-notes.md
          printf '\nWindows x64 support is beta. The Windows executable is unsigned; browser downloads may trigger Windows trust prompts.\n' >> release-notes.md
          if [ "$existing_draft" = "true" ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi

  checksums:
    needs: [validate-release, create-release, resolve-ci, quality]
    if: ${{ always() && !cancelled() && needs.create-release.result == 'success' && (needs.resolve-ci.outputs.reuse == 'true' || needs.quality.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.resolve-ci.outputs.run-id }}
          artifact-ids: ${{ needs.resolve-ci.outputs.artifact-ids }}
          pattern: validated-*
          path: validated-assets
          merge-multiple: false
          digest-mismatch: error
      - name: Validate all binary metadata and hashes
        env:
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
          RELEASE_VERSION: ${{ needs.validate-release.outputs.tag }}
          CI_RUN_ID: ${{ needs.resolve-ci.outputs.run-id }}
        run: |
          set -euo pipefail
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          bun scripts/release-artifacts.ts verify validated-assets release-assets
      - name: Check release tag still points to validated commit
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA" || {
            echo "Release tag moved after validation" >&2
            exit 1
          }
      - name: Generate checksums and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(find release-assets -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = 5
          for binary in noodle-macos-arm64 noodle-macos-x86_64 noodle-linux-x86_64 noodle-linux-arm64 noodle-windows-x86_64.exe; do
            test -f "release-assets/$binary"
            test -s "release-assets/$binary"
            test ! -L "release-assets/$binary"
          done
          (cd release-assets && sha256sum noodle-* | LC_ALL=C sort -k2,2) > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(wc -l < release-assets/SHA256SUMS | tr -d ' ')" = 5
          for binary in noodle-macos-arm64 noodle-macos-x86_64 noodle-linux-x86_64 noodle-linux-arm64 noodle-windows-x86_64.exe; do
            awk -v name="$binary" '$2 == name && length($1) == 64 && $1 !~ /[^[:xdigit:]]/ { found++ } END { exit(found != 1) }' release-assets/SHA256SUMS
          done
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true" || {
            echo "Refusing to replace assets of published release $TAG" >&2
            exit 1
          }
          gh release upload "$TAG" release-assets/noodle-* release-assets/SHA256SUMS --clobber

  validate-release-artifact:
    needs: [validate-release, create-release, checksums]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.create-release.result == 'success' && needs.checksums.result == 'success' }}
    permissions:
      contents: write # Draft release downloads require push access.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            asset: noodle-macos-arm64
            shell: bash
          - os: macos-15-intel
            target: macos-x86_64
            asset: noodle-macos-x86_64
            shell: bash
          - os: windows-latest
            target: windows-x86_64
            asset: noodle-windows-x86_64.exe
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      ASSET_NAME: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Download draft release artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release download "${{ needs.create-release.outputs.tag }}" --pattern "${{ matrix.asset }}" --pattern 'SHA256SUMS' --dir release-assets
      - name: Verify downloaded macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          binary="release-assets/$ASSET_NAME"
          expected_hash=$(awk -v name="$ASSET_NAME" '$2 == name { print $1 }' release-assets/SHA256SUMS)
          [[ "$expected_hash" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "Missing or invalid macOS release checksum" >&2
            exit 1
          }
          actual_hash=$(shasum -a 256 "$binary" | awk '{ print $1 }')
          test "$actual_hash" = "$expected_hash" || {
            echo "Downloaded macOS release checksum mismatch" >&2
            exit 1
          }
          /usr/bin/codesign --verify --strict --verbose=2 "$binary"
          chmod 755 "$binary"
          expected_version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          actual_version=$("./$binary" --version)
          test "$actual_version" = "$expected_version" || {
            echo "Downloaded binary reported $actual_version, expected $expected_version" >&2
            exit 1
          }
          bun scripts/compiled-script-smoke.ts "./$binary"

      - name: Verify downloaded Windows binary
        if: runner.os == 'Windows'
        run: |
          $binary = Join-Path $PWD "release-assets/$env:ASSET_NAME"
          $escapedAsset = [Regex]::Escape($env:ASSET_NAME)
          $checksums = @(Get-Content release-assets/SHA256SUMS | Where-Object { $_ -match "^([0-9a-fA-F]{64})  $escapedAsset$" })
          if ($checksums.Count -ne 1) { throw "Missing or invalid Windows release checksum" }
          $expectedHash = ($checksums[0] -split "\s+")[0]
          $actualHash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          if ($actualHash -ine $expectedHash) { throw "Downloaded Windows release checksum mismatch" }
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $actualVersion = & $binary --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actualVersion -ne $expectedVersion) { throw "Downloaded binary reported $actualVersion, expected $expectedVersion" }
          bun scripts/compiled-script-smoke.ts "$binary"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NOODLE_TEST_BINARY = $binary
          bun test tests/integration/binaryResponse.test.ts --timeout=30000

  undraft:
    needs: [validate-release, create-release, checksums, validate-release-artifact]
    if: ${{ !cancelled() && needs.validate-release.result == 'success' && needs.create-release.result == 'success' && needs.checksums.result == 'success' && needs.validate-release-artifact.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - name: Check release tag still points to validated commit
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate-release.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_SHA" || {
            echo "Release tag moved after validation" >&2
            exit 1
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  recover-publication:
    needs: validate-release
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04-arm, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Load publication tools from the workflow commit
        env:
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TOOLING_SHA"
          mkdir -p .release-tools
          git archive FETCH_HEAD scripts/release-artifacts.ts src/app/commands/updateManifest.ts src/app/commands/updateDetect.ts | tar -x -C .release-tools
      - name: Verify published release for recovery
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false).tagName' | grep -Fx "$TAG"
          gh release download "$TAG" --pattern 'noodle-*' --pattern SHA256SUMS --dir published-assets
          bun .release-tools/scripts/release-artifacts.ts verify-published published-assets

  publication-ready:
    needs: [validate-release, undraft, recover-publication]
    if: ${{ always() && !cancelled() && needs.validate-release.result == 'success' && (needs.undraft.result == 'success' || needs.recover-publication.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "Published release validated; site and Homebrew may be synchronized."

  notify-homebrew:
    needs: [validate-release, publication-ready]
    if: ${{ always() && !cancelled() && needs.publication-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/wilfredinni/homebrew-noodle/dispatches" \
            -d "{\"event_type\": \"new-release\", \"client_payload\": {\"version\": \"$VERSION\"}}"
          echo "Homebrew notification accepted; completion is tracked in the tap's Update Formula workflow." >> "$GITHUB_STEP_SUMMARY"

  publish-update-manifest:
    needs: [validate-release, publication-ready]
    if: ${{ always() && !cancelled() && needs.publication-ready.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: noodle-update-manifest
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.validate-release.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Load publication tools from the workflow commit
        env:
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TOOLING_SHA"
          mkdir -p .release-tools
          git archive FETCH_HEAD scripts/release-artifacts.ts src/app/commands/updateManifest.ts src/app/commands/updateDetect.ts | tar -x -C .release-tools
      - name: Download release SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: gh release download "$TAG" --pattern SHA256SUMS --dir .
      - name: Build update manifest
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: bun .release-tools/scripts/release-artifacts.ts manifest SHA256SUMS update.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wilfredinni/noodle-site
          ref: main
          token: ${{ secrets.NOODLE_SITE_TOKEN }}
          path: noodle-site
      - name: Publish update manifest
        env:
          TAG: ${{ needs.validate-release.outputs.tag }}
        run: |
          set -euo pipefail
          cd noodle-site
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            bun ../.release-tools/scripts/release-artifacts.ts update-manifest ../update.json public/update.json
            git add public/update.json
            if git diff --cached --quiet; then echo "Manifest already synchronized"; exit 0; fi
            git commit -m "fix(release): synchronize manifest for Noodle ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "Manifest push failed after three attempts" >&2
          exit 1

  summary:
    needs: [validate-release, resolve-ci, quality, create-release, checksums, validate-release-artifact, undraft, recover-publication, publication-ready, publish-update-manifest, notify-homebrew]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize release stages
        env:
          STAGES: ${{ toJSON(needs) }}
          TAG: ${{ needs.validate-release.outputs.tag }}
          SHA: ${{ needs.validate-release.outputs.sha }}
          CI_RUN: ${{ needs.resolve-ci.outputs.run-id }}
          REUSE: ${{ needs.resolve-ci.outputs.reuse }}
          REASON: ${{ needs.resolve-ci.outputs.reason }}
          EVENT: ${{ github.event_name }}
        run: |
          {
            echo "Release $TAG, commit $SHA"
            if [ "$EVENT" = workflow_dispatch ]; then
              echo "Binary source: existing published release (recovery only)"
            else
              echo "Binary source: CI run $CI_RUN; reused=$REUSE; $REASON"
            fi
            echo
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$STAGES"
            echo
            echo "Homebrew success means dispatch accepted. Confirm formula completion in https://github.com/wilfredinni/homebrew-noodle/actions/workflows/update-formula.yml"
          } >> "$GITHUB_STEP_SUMMARY"
