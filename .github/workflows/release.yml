name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag (expected vX.Y.Z)" >&2
            exit 1
          fi
          package_version="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          if [[ "v$package_version" != "$tag" ]]; then
            echo "Tag $tag does not match package.json version $package_version" >&2
            exit 1
          fi
          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$tag")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tag $tag must point to a commit already integrated into main" >&2
            exit 1
          fi

  create-release:
    needs: [quality, validate-release]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          bun scripts/release-notes.ts --tag "$TAG" > release-notes.md
          if gh release view "$TAG" &>/dev/null; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/app/cli.ts --outfile noodle-${{ matrix.target }}
      - name: Smoke test compiled binary
        shell: bash
        run: |
          set -euo pipefail
          expected="$(bun -e 'const pkg = await Bun.file("package.json").json(); console.log(pkg.version)')"
          actual="$(./noodle-${{ matrix.target }} --version)"
          test "$actual" = "$expected" || {
            echo "Compiled binary reported $actual, expected $expected" >&2
            exit 1
          }
      - name: Upload binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release upload "$TAG" "noodle-${{ matrix.target }}" --clobber

  checksums:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$TAG" --pattern 'noodle-*' --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f -name 'noodle-*' | wc -l | tr -d ' ')" = 3
      - name: Generate checksums and upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum noodle-* | LC_ALL=C sort -k2,2) > release-assets/SHA256SUMS
          test -s release-assets/SHA256SUMS
          test "$(wc -l < release-assets/SHA256SUMS | tr -d ' ')" = 3
          for binary in noodle-macos-arm64 noodle-linux-x86_64 noodle-linux-arm64; do
            grep -Eq "^[[:xdigit:]]{64}[[:space:]]{2}${binary}$" release-assets/SHA256SUMS
          done
          gh release upload "$TAG" release-assets/SHA256SUMS --clobber

  notify-homebrew:
    needs: [create-release, checksums, undraft]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Notify Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not configured" >&2; exit 1; }
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/wilfredinni/homebrew-noodle/dispatches" \
            -d "{\"event_type\": \"new-release\", \"client_payload\": {\"version\": \"$VERSION\"}}"

  undraft:
    needs: [create-release, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false

  publish-update-manifest:
    needs: [create-release, checksums, undraft]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Download release SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern 'SHA256SUMS' --dir .

      - name: Build update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          set -euo pipefail

          sha256sums=$(cat SHA256SUMS)
          macos_hash=$(echo "$sha256sums" | grep 'noodle-macos-arm64\b' | awk '{print $1}')
          linux_x86_hash=$(echo "$sha256sums" | grep 'noodle-linux-x86_64\b' | awk '{print $1}')
          linux_arm_hash=$(echo "$sha256sums" | grep 'noodle-linux-arm64\b' | awk '{print $1}')

          test -n "$macos_hash" || { echo "Missing macos-arm64 checksum" >&2; exit 1; }
          test -n "$linux_x86_hash" || { echo "Missing linux-x86_64 checksum" >&2; exit 1; }
          test -n "$linux_arm_hash" || { echo "Missing linux-arm64 checksum" >&2; exit 1; }

          echo "{" > update.json
          echo "  \"version\": \"${TAG}\"," >> update.json
          echo "  \"assets\": {" >> update.json
          echo "    \"macos-arm64\": { \"sha256\": \"${macos_hash}\" }," >> update.json
          echo "    \"linux-x86_64\": { \"sha256\": \"${linux_x86_hash}\" }," >> update.json
          echo "    \"linux-arm64\": { \"sha256\": \"${linux_arm_hash}\" }" >> update.json
          echo "  }" >> update.json
          echo "}" >> update.json

      - uses: actions/checkout@v7
        with:
          repository: wilfredinni/noodle-site
          token: ${{ secrets.NOODLE_SITE_TOKEN }}
          path: noodle-site

      - name: Publish update manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        working-directory: noodle-site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          cp ../update.json public/update.json

          if git diff --quiet; then
            echo "No changes to update.json"
            exit 0
          fi

          git add public/update.json
          git commit -m "Update manifests for Noodle ${TAG}"
          git push origin main
