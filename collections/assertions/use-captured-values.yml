name: Use Captured Values
method: GET
url: $base_url/users/$created_user_id
timeout: 0
tags:
  - capture-chain
followRedirects: true
maxRedirects: 5
headers:
  Accept: $response_content_type
params:
  - name: created_post_id
    value: $created_post_id
body_type: none
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.id
    operator: equals
    value: 1
  - expression: body.username
    operator: equals
    value: Bret
