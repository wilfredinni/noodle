name: Update Comment
method: PATCH
url: $base_url/comments/:commentId
timeout: 0
followRedirects: true
maxRedirects: 5
headers:
  Content-Type: application/json
path_params:
  - name: commentId
    value: '1'
body: |-
  {
    "postId": 1,
    "name": "test comment",
    "email": "test@example.com",
    "body": "comment body"
  }
body_type: json
