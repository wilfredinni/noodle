name: Create Comment
method: POST
url: $base_url/comments
timeout: 0
followRedirects: true
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "postId": 1,
    "name": $random.name,
    "email": $random.email,
    "body": $random.loremText,
    "timestamp": $time.now
  }
body_type: json
