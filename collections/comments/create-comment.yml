name: Create Comment
method: POST
url: $base_url/comments
timeout: 0
followRedirects: true
maxRedirects: 5
headers:
  Content-Type: application/json
body: |-
  {
    "id": $random.uuid,
    "timestamp": $time.iso,
    "name": $random.name,
    "email": $random.email,
    "body": $random.loremText
    }
body_type: json
