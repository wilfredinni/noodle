# The collection root ignores folder.yml. This equivalent setup is used when
# opening the parent collections/ directory instead of this standalone suite.
meta:
  name: Inheritance, schemas and datasets
  seq: 4
tags:
  - scripting-data
scripts:
  pre: |-
    noodle.run.set("collectionReady", true)
    noodle.run.set("exampleSteps", ["suite-pre"])
  post: |-
    noodle.run.set("exampleSteps", [...noodle.run.get("exampleSteps"), "suite-post"])
tests: |-
  test("successful response", () => expect(noodle.response.status).toBe(200))
  test("suite pre and post ran", () => {
    const steps = noodle.run.get("exampleSteps")
    expect(steps[0]).toBe("suite-pre")
    expect(steps).toContain("suite-post")
  })
