name: Get user with nested scripts and tests
method: GET
url: https://jsonplaceholder.typicode.com/users/$user_id
timeout: 0
scripts:
  pre: |-
    noodle.run.set("exampleSteps", [...noodle.run.get("exampleSteps"), "request-pre"])
  post: |-
    noodle.run.set("exampleSteps", [...noodle.run.get("exampleSteps"), "request-post"])
tests: |-
  test("pre hooks enter scopes and post hooks leave them", () => {
    expect(noodle.run.get("exampleSteps")).toEqual([
      "suite-pre", "users-pre", "nested-pre", "request-pre",
      "request-post", "nested-post", "users-post", "suite-post"
    ])
  })
  test("nested requests read the same iteration row", () => {
    expect(noodle.response.json()).toHaveProperty("id", Number(noodle.iteration.data.user_id))
    expect(noodle.iteration.index).toBeGreaterThanOrEqual(0)
    expect(noodle.iteration.index).toBeLessThan(noodle.iteration.count)
  })
