meta:
  name: Users
tags:
  - smoke
scripts:
  pre: |-
    if (!noodle.run.get("collectionReady")) throw Error("collection pre did not run")
    noodle.request.headers.set("X-Example", "inherited")
tests: |-
  test("user schema", () => {
    expect(noodle.response.json()).toMatchSchema({
      type: "object",
      required: ["id", "email", "roles"],
      properties: {
        id: { type: "integer" },
        email: { type: "string", format: "email" },
        roles: { type: "array", items: { type: "string" } }
      }
    })
  })
