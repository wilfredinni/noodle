# Run with post-response-use-values in one collection run to share these values.
name: Extract Post-response Values
method: GET
url: $base_url/posts/1
timeout: 0
tags:
  - post-response-chain
body_type: none
scripts:
  pre: |-
    noodle.request.headers.set("Accept", "application/json");
    console.info("Prepared", noodle.request.method, noodle.request.url);
  post: |-
    if (noodle.response.status === 200) {
      if (!noodle.response.headers.has("Content-Type") ||
          !noodle.response.headers.get("content-type").includes("application/json")) {
        throw Error("Expected a JSON response");
      }
      const post = noodle.response.json();
      if (noodle.run.get("post_response_user_id") !== post.userId) {
        throw Error("Expected the capture to commit before post");
      }
      noodle.run.set("post_response_post_id", post.id);
      noodle.run.set("post_response_title", post.title);
      console.info("Extracted post", post.id, {
        statusText: noodle.response.statusText,
        timeMs: noodle.response.timeMs,
        textLength: noodle.response.text().length,
      });
    } else {
      console.warn("Skipping extraction", noodle.response.status, noodle.response.statusText);
    }
capture:
  post_response_user_id:
    value: body.userId
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.id
    operator: equals
    value: 1
  - expression: body.userId
    operator: isNumber
