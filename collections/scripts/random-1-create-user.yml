name: Random user and next-request preparation
method: POST
url: $base_url/posts
timeout: 0
body_type: json
body: '{}'
scripts:
  pre: |-
    random.seed(42);
    const user = {
      id: random.uuid(),
      name: random.name(),
      email: random.exampleEmail(),
      age: random.number({ min: 18, max: 80 }),
    };
    request.body.setJson(user);
    request.headers.set("X-Request-ID", user.id);
    console.info("Generated user", user);
  post: |-
    if (response.status === 201) {
      run.set("next_random_user", {
        id: random.uuid(),
        name: random.name(),
        email: random.exampleEmail(),
      });
      console.info("Prepared data for the next request");
    }
assert:
  - expression: status
    operator: equals
    value: 201
auth:
  type: none
