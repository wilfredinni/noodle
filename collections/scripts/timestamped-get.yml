name: Timestamped GET
method: GET
url: $base_url/posts/1
timeout: 0
followRedirects: true
maxRedirects: 5
scripts:
  pre: |-
    const timestamp = new Date().toISOString();
    noodle.request.headers.set("X-Noodle-Timestamp", timestamp);
    noodle.request.headers.set(
      "X-Noodle-Digest",
      noodle.crypto.sha256(timestamp + ":" + noodle.request.url, "hex"),
    );
    console.info("Added timestamp and request digest");
assert:
  - expression: status
    operator: equals
    value: 200
  - expression: body.id
    operator: equals
    value: 1
auth:
  type: none
